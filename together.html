<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Together — Siddhi Malpe</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --brand-teal: #79d7c6;
      --bg-canvas: #f5f6f8;
      --text-dark: #000000;
      --border-stroke: 1.2px solid #000000;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg-canvas); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-dark); overflow-x: hidden; min-height: 100vh; }

    #progress-bar {
      position: fixed; top: 0; left: 0; height: 2px; width: 0%; background: var(--brand-teal); z-index: 2000; transition: width 0.1s ease-out;
    }

    .top-nav {
      position: sticky; top: 0; left: 0; width: 100%; padding: 20px 48px; display: flex; align-items: center; justify-content: space-between; background: rgba(245, 246, 248, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 1000;
    }

    .nav-pill {
      display: inline-flex; align-items: center; gap: 6px; color: var(--text-dark); text-decoration: none; font-size: 14px; font-weight: 500; border: var(--border-stroke); border-radius: 9999px; padding: 8px 22px; background: #ffffff; transition: all 0.25s var(--ease); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .nav-pill:hover {
      background: #000000; color: #ffffff; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .nav-right-group { display: flex; align-items: center; gap: 12px; }

    .case-container {
      width: 100%; max-width: 1040px; margin: 40px auto 100px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); overflow: hidden; display: flex; flex-direction: column; align-items: center;
    }

    .case-container img { width: 100%; height: auto; display: block; }

    .other-work-section { width: 100%; max-width: 1140px; margin: 0 auto; padding: 0 24px 120px; display: flex; flex-direction: column; align-items: center; }
    .other-work-title { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 48px; text-align: center; }
    .cards-row { display: flex; align-items: center; justify-content: center; gap: 40px; width: 100%; flex-wrap: wrap; }

    .work-card {
      width: 273px; height: 680px; border: var(--border-stroke); border-radius: 136.5px; background-color: #ffffff; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-dark); padding: 56px 0 0; position: relative; flex-shrink: 0; cursor: pointer; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }

    .work-card:hover { transform: translateY(-8px); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12); }
    .card-title { font-size: 30px; font-weight: 600; line-height: 1.2; text-align: center; margin-bottom: 4px; padding: 0 20px; }
    .card-subtitle { font-size: 16px; font-weight: 400; line-height: 1.4; text-align: center; color: #333333; margin-bottom: 24px; padding: 0 20px; }
    .card-image-wrapper { width: 100%; flex: 1; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; margin-top: auto; }
    .card-image-wrapper img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }

    @media (max-width: 960px) {
      .top-nav { padding: 16px 20px; }
      .case-container { margin: 20px 16px 60px; border-radius: 12px; }
      .cards-row { gap: 30px; }
    }
  </style>
</head>
<body>

  <div id="progress-bar"></div>

  <nav class="top-nav">
    <a href="/#work" class="nav-pill">← All Projects</a>
    <div class="nav-right-group">
      <a href="/#contact" class="nav-pill">Contact</a>
      <a href="https://drive.google.com/file/d/1a8mlDD0jzYdRFJJqXY0Y0knbyZKDnXD9/view?usp=sharing" class="nav-pill" target="_blank" rel="noreferrer">Resume</a>
    </div>
  </nav>

  <!-- Together Image -->
  <main class="case-container">
    <img src="/src/together-case-study.jpg" alt="Together Case Study" loading="eager" />
  </main>

  <!-- Bottom 3 Projects -->
  <section class="other-work-section">
    <h2 class="other-work-title">Explore Other Projects</h2>

    <div class="cards-row">
      <a class="work-card" href="/nexus.html">
        <strong class="card-title">Nexus</strong>
        <small class="card-subtitle">B2B SaaS</small>
        <span class="card-image-wrapper"><img src="/nexus%20thumbnail.png" alt="Nexus Thumbnail" /></span>
      </a>
      <a class="work-card" href="/aris.html">
        <strong class="card-title">Aris</strong>
        <small class="card-subtitle">Agentic AI</small>
        <span class="card-image-wrapper"><img src="/aris%20thumbnail.png" alt="Aris Thumbnail" /></span>
      </a>
      <a class="work-card" href="/broke-ya-woke.html">
        <strong class="card-title">Broke Ya<br />Woke?</strong>
        <small class="card-subtitle">Phygital Game</small>
        <span class="card-image-wrapper"><img src="/byw%20thumbnail.png" alt="Broke Ya Woke Thumbnail" /></span>
      </a>
    </div>
  </section>

  <script>
    window.addEventListener('scroll', () => {
      const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      document.getElementById('progress-bar').style.width = ((winScroll / height) * 100) + '%';
    });
  </script>

</body>
</html>
